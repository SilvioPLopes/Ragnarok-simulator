name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ragnarok_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgre
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'microsoft'
          cache: maven

      - name: Build and verify (tests + JaCoCo quality gate)
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: ragnarok_test
          DB_USER: postgres
          DB_PASS: postgre
        run: ./mvnw verify --no-transfer-progress
