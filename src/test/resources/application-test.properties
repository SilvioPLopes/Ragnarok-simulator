# Configurações de teste — aponta para banco de dados isolado ragnarok_test
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ragnarok_test}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:postgre}
spring.jpa.hibernate.ddl-auto=update

# Desativa Flyway em testes (JPA cria/atualiza as tabelas via ddl-auto)
spring.flyway.enabled=false

# Limita pool de conexões por contexto Spring para não esgotar max_connections=100 do PostgreSQL
# Com múltiplos contextos (diferentes @MockBean combos), cada um abre um pool separado
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

# Reduz verbosidade nos logs de teste
spring.jpa.show-sql=false
logging.level.root=ERROR
logging.level.com.ragnarok=WARN

# JWT secret para testes (qualquer string >= 32 chars)
app.jwt.secret=test-secret-key-for-integration-tests-only-256bits
