spring.application.name=ragnarok-core
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ragnarok_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:postgre}
spring.jpa.hibernate.ddl-auto=validate

# Desativa a exibicao do SQL bruto no console
spring.jpa.show-sql=false

# Desativa logs internos do Hibernate (evita spam de transacao)
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF
logging.level.org.hibernate.transaction=OFF

# Mantem apenas logs criticos do sistema (ERRO/WARN)
logging.level.root=ERROR
logging.level.com.ragnarok=INFO

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Flyway manages schema. Hibernate validates on startup.

# Resilience4j — rAthena import retry and circuit breaker
resilience4j.retry.instances.rathena.max-attempts=3
resilience4j.retry.instances.rathena.wait-duration=2s
resilience4j.retry.instances.rathena.enable-exponential-backoff=true
resilience4j.retry.instances.rathena.exponential-backoff-multiplier=2

resilience4j.circuitbreaker.instances.rathena.sliding-window-size=3
resilience4j.circuitbreaker.instances.rathena.failure-rate-threshold=100
resilience4j.circuitbreaker.instances.rathena.wait-duration-in-open-state=30s

# JWT
app.jwt.secret=ragnarok-secret-key-change-in-production-must-be-at-least-256-bits

