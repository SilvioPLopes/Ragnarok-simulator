spring.application.name=ragnarok-core
spring.datasource.url=jdbc:postgresql://localhost:5432/ragnarok_db
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

# Desativa a exibição do SQL bruto no console
spring.jpa.show-sql=false

# Desativa logs internos do Hibernate (evita spam de transação)
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF
logging.level.org.hibernate.transaction=OFF

# Mantém apenas logs críticos do sistema (ERRO/WARN)
logging.level.root=ERROR
logging.level.com.ragnarok=INFO