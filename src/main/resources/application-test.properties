spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ragnarok_test}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:postgre}
spring.jpa.hibernate.ddl-auto=update

# Desativa a exibicao do SQL bruto no console
spring.jpa.show-sql=false

# Desativa logs internos do Hibernate (evita spam de transacao)
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF
logging.level.org.hibernate.transaction=OFF

# Mantem apenas logs criticos do sistema (ERRO/WARN)
logging.level.root=ERROR
logging.level.com.ragnarok=INFO

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# IMPORTANTE: desligar o auto-create do Hibernate
# O Flyway vai criar as tabelas, nao o Hibernate
